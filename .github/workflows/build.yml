name: Сборка CleanSpace.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: python -m pip install -r requirements-dev.txt

      - name: Тесты (временные папки)
        run: python -m pytest -q

      - name: Сборка EXE
        run: pyinstaller --noconfirm --clean CleanSpace.spec

      - name: Портативная версия
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/CleanSpace_portable | Out-Null
          Copy-Item dist/CleanSpace.exe dist/CleanSpace_portable/
          Set-Content -Encoding utf8 dist/CleanSpace_portable/portable.txt "Портативный режим: настройки хранятся рядом с программой."
          Compress-Archive -Path dist/CleanSpace_portable/* -DestinationPath dist/CleanSpace_portable.zip -Force

      - name: Проверка запуска EXE
        shell: pwsh
        run: |
          $p = Start-Process dist/CleanSpace.exe -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "CleanSpace.exe завершился сразу после запуска (код $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          Write-Host "CleanSpace.exe запускается нормально"

      - uses: actions/upload-artifact@v4
        with:
          name: CleanSpace
          path: |
            dist/CleanSpace.exe
            dist/CleanSpace_portable.zip

      - name: Релиз (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CleanSpace.exe
            dist/CleanSpace_portable.zip
